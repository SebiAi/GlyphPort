name: Build signed APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # Make sure ANDROID_HOME is set to androids SDK location
    - name: Build with Gradle
      run: ./gradlew :app:clean :app:assembleRelease

    - name: Decode and save keystore
      env:
        KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      run: echo "$KEYSTORE_FILE" | base64 -d > keystore.jks

      # See what build-tools are available https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
    - name: Sign APK
      env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks keystore.jks --ks-key-alias $KEY_ALIAS --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --alignment-preserved true --out app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: GlyphPort-release-apk
        path: app-release.apk
